  <path d="M512 882 L538 895 L512 908 L486 895 Z" fill="url(#gold)"/>
  <text x="512" y="937" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="6" fill="url(#gold)">TELEGRAM BOT</text>
</svg>