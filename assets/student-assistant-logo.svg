    <path d="M710 205 V287" fill="none" stroke="url(#gold)" stroke-width="8"/>
    <circle cx="710" cy="294" r="11" fill="url(#gold)"/>
    <path d="M700 304 L720 304 L727 348 L693 348 Z" fill="url(#gold)"/>
    <rect x="350" y="230" width="324" height="254" rx="100" fill="url(#silver)" stroke="#f7f9ff" stroke-width="5"/>
    <rect x="381" y="272" width="262" height="168" rx="66" fill="url(#visor)" stroke="#64748b" stroke-width="5"/>
    <path d="M435 354 Q457 320 479 354" fill="none" stroke="url(#gold)" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M544 354 Q566 320 588 354" fill="none" stroke="url(#gold)" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="352" cy="355" r="34" fill="#111c2e" stroke="url(#gold)" stroke-width="9"/>
    <path d="M400 469 Q512 516 624 469 L647 510 Q512 574 377 510 Z" fill="url(#silver)"/>
