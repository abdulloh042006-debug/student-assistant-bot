    <path d="M512 536 V650" stroke="#d8a13d" stroke-width="7"/>
    <circle cx="717" cy="546" r="67" fill="#0b1423" stroke="url(#gold)" stroke-width="9"/>
    <path d="M683 543 L750 518 L731 575 L712 559 L700 568 Z" fill="url(#gold)"/>
  </g>
  <text x="512" y="735" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="73" font-weight="800" letter-spacing="5" fill="#f7f8fc">STUDENT</text>
  <text x="512" y="813" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="77" font-weight="800" letter-spacing="2" fill="url(#gold)">ASSISTANT</text>
  <text x="512" y="861" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="7" fill="#e6eaf2">BIZ BILAN OSONROQ</text>
