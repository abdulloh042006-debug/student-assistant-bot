<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Student Assistant</title>
  <desc id="desc">Navy and gold student assistant robot with graduation cap and book.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#18263b"/><stop offset="1" stop-color="#05080f"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#fff0ae"/><stop offset=".45" stop-color="#f7c45c"/><stop offset="1" stop-color="#b97819"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#c9d3e2"/><stop offset="1" stop-color="#74849b"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#19273c"/><stop offset="1" stop-color="#03060c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="512" cy="512" r="488" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="466" fill="none" stroke="url(#gold)" stroke-width="8"/>
