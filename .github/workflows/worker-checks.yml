name: Cloudflare Worker checks

on:
  push:
    branches: [feature/cloudflare-worker-migration]
  pull_request:
    branches: [main]

jobs:
  worker-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker and helper syntax
        run: |
          node --check cloudflare-worker/src/index.js
          node --check cloudflare-worker/src/domain.js
      - name: Run domain tests
        run: node --test tests/domain.test.js
